name: Playwright Tests
on:
  # Enables the manual "Run workflow" button in GitHub
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (e.g., staging, prod)'
        required: false
        default: 'staging'
      grep:
        description: 'Run specific tests matching a tag or title (optional)'
        required: false
        default: ''
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        TEST_ENV: ${{inputs.environment}}
      # run: npx playwright test
      run: |
        if [ -n "${{inputs.grep}}" ]; then
            npx Playwright test --grep "${{inputs.grep}}"
        else
            npx playwright test tests/01-homepageUI.spec.ts tests/02-guestUserTest.spec.ts tests/03-createNewUser.spec.ts tests/04-addBalanceTest.spec.ts --workers=1
        fi
            
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
